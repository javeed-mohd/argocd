apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/javeed-mohd/argocd.git
    targetRevision: main
    path: namespaces
  destination:
    server: https://kubernetes.default.svc    # Current EKS cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true       # If deleted in git, delete in cluster also
      selfHeal: true    # If someone manually change through CLI, do the self heal