apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalogue-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/javeed-mohd/catalogue.git'
    targetRevision: main      # Replace with your desired version
    path: helm
    helm:
      valueFiles:
        - values.yaml
        - values-uat.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: roboshop-uat
  syncPolicy:
    automated:
      prune: true